<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>豆包影视盒</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="bar">
  <div class="brand">豆包影视盒</div>
  <div class="sub" id="sub">手机版</div>
</header>

<main>
  <div class="searchbar">
    <input id="wd" type="search" placeholder="输入片名，按搜索键" enterkeyhint="search" autocomplete="off" />
    <button id="btnSearch">搜索</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">输入片名开始搜索</div>
</main>

<section class="sheet" id="sheet">
  <div class="sheet-hd">
    <div class="sheet-title" id="dTitle"></div>
    <button class="x" id="btnClose">✕</button>
  </div>
  <div class="meta" id="dMeta"></div>
  <div class="srcline" id="dSrc"></div>
  <div class="lines" id="dLines"></div>
</section>

<section class="player" id="player">
  <video id="v" controls playsinline webkit-playsinline preload="metadata"></video>
  <div class="pbar">
    <button class="back" id="btnBack">‹ 返回</button>
    <div class="ptitle" id="pTitle"></div>
  </div>
</section>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
